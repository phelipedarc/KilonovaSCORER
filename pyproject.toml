[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kilonova_scorer"
version = "0.1.0"
authors = [
  { name="P.Darc", email="phelipedarc@gmail.com" },
]
description = "KilonovaScorer: Simulation-based Scoring System for LSST data"
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
    "numpy>=1.20.0",
    "pandas>=1.3.0",
    "scipy>=1.7.0",
    "matplotlib>=3.4.0",
    "tqdm>=4.60.0",
]

[project.urls]
"Homepage" = "https://github.com/phelipedarc/kilonova_scorer"
"Bug Tracker" = "https://github.com/phelipedarc/kilonova_scorer/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["*.json", "*.csv"]